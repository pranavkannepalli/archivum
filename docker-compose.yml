services:
  backend:
    build: ./apps/backend
    container_name: archivum-backend
    restart: unless-stopped
    extra_hosts:
      # On Linux, this maps `host.docker.internal` to the Docker host gateway.
      - "host.docker.internal:host-gateway"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - LLM_EXTRACTION_PROVIDER=${LLM_EXTRACTION_PROVIDER:-anthropic}
      - LLM_SYNTHESIS_PROVIDER=${LLM_SYNTHESIS_PROVIDER:-anthropic}
      - JWT_SECRET=${JWT_SECRET:-}
      - OWNER_PASSWORD=${OWNER_PASSWORD:-}
      - OWNER_USERNAME=${OWNER_USERNAME:-admin}
      - PUBLIC_WIKI_ENABLED=${PUBLIC_WIKI_ENABLED:-false}
      - PAGE_WRITE_WORKER_ENABLED=true
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_RECREATE_COLLECTION_ON_DIM_MISMATCH=true
      - WIKI_DIR=/data/wiki
      - RAW_DIR=/data/raw
      - DB_PATH=/data/archivum.db
      - KUZU_PATH=/data/kuzu
      - MCP_API_KEY=${MCP_API_KEY:-}
      - EMBED_PROVIDER=${EMBED_PROVIDER:-local}
      - EMBED_MODEL=${EMBED_MODEL:-BAAI/bge-small-en-v1.5}
      - EMBED_DIM=${EMBED_DIM:-0}
      - EMBED_OPENAI_COMPAT_PROVIDER=${EMBED_OPENAI_COMPAT_PROVIDER:-openai}
      - EMBED_BASE_URL=${EMBED_BASE_URL:-}
      - EMBED_API_KEY=${EMBED_API_KEY:-}
      - EMBED_AZURE_API_VERSION=${EMBED_AZURE_API_VERSION:-2024-02-15-preview}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-claude-haiku-4-5-20251001}
      - LLM_SYNTHESIS_MODEL=${LLM_SYNTHESIS_MODEL:-claude-sonnet-4-6}
      - OPENAI_COMPAT_PROVIDER=${OPENAI_COMPAT_PROVIDER:-openai}
      - OPENAI_COMPAT_BASE_URL=${OPENAI_COMPAT_BASE_URL:-}
      - OPENAI_COMPAT_API_KEY=${OPENAI_COMPAT_API_KEY:-}
      - OPENAI_COMPAT_AZURE_API_VERSION=${OPENAI_COMPAT_AZURE_API_VERSION:-2024-02-15-preview}
      # Session capture reads agent transcripts from a mounted directory; unset
      # here means the watcher does nothing rather than guessing at a path.
      - TRANSCRIPT_DIRS=${TRANSCRIPT_DIRS:-}
      - TRANSCRIPT_WATCH_ENABLED=${TRANSCRIPT_WATCH_ENABLED:-true}
      - CODE_CACHE_DIR=${CODE_CACHE_DIR:-/data/code-cache}
      - SUMMARY_WORKER_ENABLED=${SUMMARY_WORKER_ENABLED:-true}
      - SUMMARY_WORKER_INTERVAL_SECONDS=${SUMMARY_WORKER_INTERVAL_SECONDS:-3600}
      - MCP_PUBLIC_URL=${MCP_PUBLIC_URL:-}
    volumes:
      - wiki_data:/data/wiki
      - raw_data:/data/raw
      - db_data:/data
      - kuzu_data:/data/kuzu
      - codex_home:/home/app/.codex
      - claude_home:/home/app/.claude
      # Agent transcripts, read-only: capture reads them and must never write
      # back into a directory another tool owns.
      - ${TRANSCRIPT_HOST_DIR:-./.no-transcripts}:/data/transcripts:ro
    networks:
      - archivum-net
    depends_on:
      qdrant:
        condition: service_healthy

  frontend:
    build: ./apps/frontend
    container_name: archivum-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ARCHIVUM_FRONTEND_PORT:-8473}:8080"
    networks:
      - archivum-net
    depends_on:
      backend:
        condition: service_started

  mcp:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.mcp
    container_name: archivum-mcp
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - LLM_EXTRACTION_PROVIDER=${LLM_EXTRACTION_PROVIDER:-anthropic}
      - LLM_SYNTHESIS_PROVIDER=${LLM_SYNTHESIS_PROVIDER:-anthropic}
      - JWT_SECRET=${JWT_SECRET:-}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_RECREATE_COLLECTION_ON_DIM_MISMATCH=true
      - WIKI_DIR=/data/wiki
      - RAW_DIR=/data/raw
      - DB_PATH=/data/archivum.db
      - KUZU_PATH=/data/kuzu
      - MCP_API_KEY=${MCP_API_KEY:-}
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8001
      - EMBED_PROVIDER=${EMBED_PROVIDER:-local}
      - EMBED_MODEL=${EMBED_MODEL:-BAAI/bge-small-en-v1.5}
      - EMBED_DIM=${EMBED_DIM:-0}
      - EMBED_OPENAI_COMPAT_PROVIDER=${EMBED_OPENAI_COMPAT_PROVIDER:-openai}
      - EMBED_BASE_URL=${EMBED_BASE_URL:-}
      - EMBED_API_KEY=${EMBED_API_KEY:-}
      - EMBED_AZURE_API_VERSION=${EMBED_AZURE_API_VERSION:-2024-02-15-preview}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-claude-haiku-4-5-20251001}
      - LLM_SYNTHESIS_MODEL=${LLM_SYNTHESIS_MODEL:-claude-sonnet-4-6}
      - OPENAI_COMPAT_PROVIDER=${OPENAI_COMPAT_PROVIDER:-openai}
      - OPENAI_COMPAT_BASE_URL=${OPENAI_COMPAT_BASE_URL:-}
      - OPENAI_COMPAT_API_KEY=${OPENAI_COMPAT_API_KEY:-}
      - OPENAI_COMPAT_AZURE_API_VERSION=${OPENAI_COMPAT_AZURE_API_VERSION:-2024-02-15-preview}
      # Session capture reads agent transcripts from a mounted directory; unset
      # here means the watcher does nothing rather than guessing at a path.
      - TRANSCRIPT_DIRS=${TRANSCRIPT_DIRS:-}
      - TRANSCRIPT_WATCH_ENABLED=${TRANSCRIPT_WATCH_ENABLED:-true}
      - CODE_CACHE_DIR=${CODE_CACHE_DIR:-/data/code-cache}
      - SUMMARY_WORKER_ENABLED=${SUMMARY_WORKER_ENABLED:-true}
      - SUMMARY_WORKER_INTERVAL_SECONDS=${SUMMARY_WORKER_INTERVAL_SECONDS:-3600}
    ports:
      - "127.0.0.1:${ARCHIVUM_MCP_PORT:-8001}:8001"
    volumes:
      - wiki_data:/data/wiki
      - raw_data:/data/raw
      - db_data:/data
      - kuzu_data:/data/kuzu
      # The MCP server summarises clusters too, so it needs the same signed-in
      # CLI credentials the API has — otherwise `summarise_vault` is
      # unauthenticated and every summary silently fails.
      - codex_home:/home/app/.codex
      - claude_home:/home/app/.claude
    networks:
      - archivum-net
    depends_on:
      - backend

  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: archivum-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - archivum-net
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && head -n 1 <&3 | grep -q \"200\"'"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  wiki_data:
  raw_data:
  db_data:
  kuzu_data:
  qdrant_data:
  codex_home:
  claude_home:

networks:
  archivum-net:
    driver: bridge
